global:
  scrape_interval: 15s

scrape_configs:
  - job_name: agent-app            # app.py exposes /metrics on :8001 while it runs
    static_configs:
      - targets: ["host.docker.internal:8001"]
  - job_name: node                 # host CPU / memory / disk
    static_configs:
      - targets: ["node-exporter:9100"]
